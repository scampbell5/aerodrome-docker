services:
  aerodrome:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AERODROME_REF: v3.4.136

    container_name: aerodrome
    restart: unless-stopped

    ports:
      - "7070:8000"

    environment:
      TZ: "America/New_York"
      STATS_TIMEZONE: "America/New_York"
      RECEIVER_HOST: "piaware"
      RECEIVER_PORT: "80"
      RECEIVER_PATH: "/data/aircraft.json"
      RECEIVER_POLL_INTERVAL: "60"
      DISTANCE_UNIT: "nmi"
      TRACK_LINK_PROVIDER: "flightaware"
      RECEIVER_LATITUDE: "${RECEIVER_LATITUDE:-}"
      RECEIVER_LONGITUDE: "${RECEIVER_LONGITUDE:-}"

    volumes:
      - aerodrome-data:/data

    networks:
      - adsb-net

    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  aerodrome-data:

networks:
  adsb-net:
    external: true
